services:
  mysql:
    image: mysql:8.0
    container_name: pnl-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pnl
      MYSQL_USER: pnl
      MYSQL_PASSWORD: pnl
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/pnl.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: pnl-adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  kafka:
    image: apache/kafka:3.7.0
    container_name: pnl-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "cHl0aG9uLXBubC1rcmFmdA"
    ports:
      - "29092:29092"

  redis:
    image: redis:7-alpine
    container_name: pnl-redis
    ports:
      - "6379:6379"

  kafka-connect:
    image: debezium/connect:2.7
    container_name: pnl-kafka-connect
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: pnl-connect
      CONFIG_STORAGE_TOPIC: pnl_connect_configs
      OFFSET_STORAGE_TOPIC: pnl_connect_offsets
      STATUS_STORAGE_TOPIC: pnl_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pnl-app
    command: uvicorn pnl.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PNL_MYSQL_HOST: mysql
      PNL_MYSQL_PORT: "3306"
      PNL_MYSQL_USER: pnl
      PNL_MYSQL_PASSWORD: pnl
      PNL_MYSQL_DB: pnl
      PNL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PNL_REDIS_HOST: redis
      PNL_CLICKHOUSE_HOST: clickhouse
    ports:
      - "8000:8000"
    volumes:
      - ./pnl:/app/pnl
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      clickhouse:
        condition: service_started

  cdc-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pnl-cdc-worker
    command: python -m pnl.cdc.main
    environment:
      PNL_MYSQL_HOST: mysql
      PNL_MYSQL_PORT: "3306"
      PNL_MYSQL_USER: pnl
      PNL_MYSQL_PASSWORD: pnl
      PNL_MYSQL_DB: pnl
      PNL_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PNL_REDIS_HOST: redis
    volumes:
      - ./pnl:/app/pnl
    depends_on:
      - kafka
      - redis
      - mysql

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: pnl-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  mysql_data:
  clickhouse_data:
